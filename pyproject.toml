[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gravai"]

[project]
name = "gravai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "httpx>=0.28.1",
    "playwright",
    "pyaudio>=0.2.14",
    "websockets>=16.0",
    "opuslib>=3.0.1",
    "requests>=2.34.2",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.0.2",
    "types-requests>=2.33.0.20261006",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src/gravai"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeArgument = "error"
reportUnknownParameterType = "error"
